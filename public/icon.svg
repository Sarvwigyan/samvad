<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#D4A24C"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1815"/>
      <stop offset="100%" stop-color="#0B0A08"/>
    </radialGradient>
  </defs>
  
  <!-- Background Disc -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldSaffron)" stroke-width="4" opacity="0.4"/>
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldSaffron)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Dharmachakra Outer Rim -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldSaffron)" stroke-width="16"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="url(#goldSaffron)" stroke-width="3" opacity="0.8"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="url(#goldSaffron)" stroke-width="10"/>

  <!-- Central Hub -->
  <circle cx="256" cy="256" r="32" fill="url(#goldSaffron)"/>
  <circle cx="256" cy="256" r="16" fill="#0B0A08"/>
  
  <!-- 8 Spokes (Astangika / Dharma Paths) -->
  <g stroke="url(#goldSaffron)" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="96" x2="256" y2="196"/>
    <line x1="256" y1="316" x2="256" y2="416"/>
    <line x1="96" y1="256" x2="196" y2="256"/>
    <line x1="316" y1="256" x2="416" y2="256"/>
    <line x1="143" y1="143" x2="213" y2="213"/>
    <line x1="299" y1="299" x2="369" y2="369"/>
    <line x1="369" y1="143" x2="299" y2="213"/>
    <line x1="213" y1="299" x2="143" y2="369"/>
  </g>

  <!-- Rim Jewels (Lotus Nodes) -->
  <circle cx="256" cy="96" r="8" fill="#FF9933"/>
  <circle cx="256" cy="416" r="8" fill="#FF9933"/>
  <circle cx="96" cy="256" r="8" fill="#FF9933"/>
  <circle cx="416" cy="256" r="8" fill="#FF9933"/>
  <circle cx="143" cy="143" r="8" fill="#FF9933"/>
  <circle cx="369" cy="369" r="8" fill="#FF9933"/>
  <circle cx="369" cy="143" r="8" fill="#FF9933"/>
  <circle cx="143" cy="369" r="8" fill="#FF9933"/>
</svg>
